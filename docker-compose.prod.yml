# Production stack: one optimized app image (Express API + built SPA + Socket.io)
# behind a single port, plus a persistent MongoDB. From the repo root:
#   docker compose -f docker-compose.prod.yml up --build
services:
  mongo:
    image: mongo:7
    container_name: spotify-mongo
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        # baked into the frontend bundle at build time
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY}
    container_name: spotify-app
    restart: unless-stopped
    ports:
      - "5000:5000"                 # open http://localhost:5000
    environment:
      - NODE_ENV=production
      - PORT=5000
      - MONGODB_URI=mongodb://mongo:27017/spotify-clone   # bundled Mongo
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - CLERK_PUBLISHABLE_KEY=${CLERK_PUBLISHABLE_KEY}
      - CLERK_SECRET_KEY=${CLERK_SECRET_KEY}
      - CLOUDINARY_CLOUD_NAME=${CLOUDINARY_CLOUD_NAME}
      - CLOUDINARY_API_KEY=${CLOUDINARY_API_KEY}
      - CLOUDINARY_API_SECRET=${CLOUDINARY_API_SECRET}
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo-data:
