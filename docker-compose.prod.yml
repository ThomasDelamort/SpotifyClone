# Production stack — two independent images behind one public port.
#
#   cp .env.docker.example .env   # then fill it in
#   docker compose -f docker-compose.prod.yml up --build   -> http://localhost:8080
#   docker compose -f docker-compose.prod.yml --profile local-db up --build
#
#   browser :8080 -> [frontend: nginx]  /            -> built SPA
#                                       /api/*       -> [backend:5000]
#                                       /socket.io/* -> [backend:5000] (websocket)
#
# The backend is not published to the host — nginx is the only way in. Add a
# `ports:` entry to the backend service if you need to reach the API directly.
name: spotify-clone-prod

services:
  # Optional bundled database — omit the profile and point MONGODB_URI at Atlas.
  mongo:
    # MongoDB 5+ needs a CPU with AVX. On older hardware it crashes with exit
    # 132 — set MONGO_TAG=4.4 in the repo-root .env to fall back.
    image: mongo:${MONGO_TAG:-7}
    profiles: ["local-db"]
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\" || mongo --quiet --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      target: prod
    restart: unless-stopped
    expose:
      - "5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI:-mongodb://mongo:27017/spotify-clone}
      ADMIN_EMAIL: ${ADMIN_EMAIL:?set ADMIN_EMAIL in .env}
      CLERK_PUBLISHABLE_KEY: ${CLERK_PUBLISHABLE_KEY:?set CLERK_PUBLISHABLE_KEY in .env}
      CLERK_SECRET_KEY: ${CLERK_SECRET_KEY:?set CLERK_SECRET_KEY in .env}
      CLOUDINARY_CLOUD_NAME: ${CLOUDINARY_CLOUD_NAME:?set CLOUDINARY_CLOUD_NAME in .env}
      CLOUDINARY_API_KEY: ${CLOUDINARY_API_KEY:?set CLOUDINARY_API_KEY in .env}
      CLOUDINARY_API_SECRET: ${CLOUDINARY_API_SECRET:?set CLOUDINARY_API_SECRET in .env}
    depends_on:
      mongo:
        condition: service_healthy
        required: false

  frontend:
    build:
      context: ./frontend
      target: prod
      args:
        # Vite inlines this into the bundle at build time, so changing it needs
        # a rebuild (--build), not just a restart.
        VITE_CLERK_PUBLISHABLE_KEY: ${VITE_CLERK_PUBLISHABLE_KEY:?set VITE_CLERK_PUBLISHABLE_KEY in .env}
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-8080}:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  mongo-data:
