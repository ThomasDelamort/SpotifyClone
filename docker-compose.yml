# Development stack — frontend and backend are separate images/containers.
#
#   docker compose up --build                      -> http://localhost:3000 (vite + HMR)
#                                                     http://localhost:5000 (API, direct)
#   docker compose --profile local-db up --build   -> also runs a local MongoDB
#
# In dev the SPA calls the API directly at localhost:5000 (see
# frontend/src/lib/axios.ts) and the backend allows that origin via CORS.
# Production routes everything through nginx instead — see docker-compose.prod.yml.
name: spotify-clone

services:
  # Optional bundled database. backend/.env currently points at MongoDB Atlas,
  # so this only starts when you ask for it:  --profile local-db
  # (then set MONGODB_URI=mongodb://mongo:27017/spotify-clone in backend/.env)
  mongo:
    # MongoDB 5+ needs a CPU with AVX. On older hardware it crashes with exit
    # 132 — set MONGO_TAG=4.4 in the repo-root .env to fall back.
    image: mongo:${MONGO_TAG:-7}
    profiles: ["local-db"]
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval \"db.adminCommand('ping')\" || mongo --quiet --eval \"db.adminCommand('ping')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    env_file:
      - ./backend/.env
    ports:
      - "${API_PORT:-5000}:5000"    # must match PORT in backend/.env
    volumes:
      - ./backend:/app              # live code
      - backend-node-modules:/app/node_modules   # keep the image's deps
    command: npm run dev -- -L      # nodemon, -L = polling watch (needed on Windows/WSL2)
    depends_on:
      mongo:
        condition: service_healthy
        required: false             # ignored unless the local-db profile is on

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      - VITE_USE_POLLING=true       # turns on vite's polling watcher (see vite.config.ts)
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./frontend:/app
      - frontend-node-modules:/app/node_modules
    depends_on:
      - backend

volumes:
  mongo-data:
  backend-node-modules:
  frontend-node-modules:
