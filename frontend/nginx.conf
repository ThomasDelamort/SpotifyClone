# Serves the built SPA and reverse-proxies the API + websockets to the backend
# container. Installed at /etc/nginx/conf.d/default.conf, which nginx includes
# inside its http{} block — so the map below is valid at the top of this file.

# Required for the Socket.io websocket handshake (Connection: upgrade/close).
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Docker's embedded DNS. Resolving the backend per-request (rather than once
    # at startup) means nginx still boots if the backend is down, and picks up a
    # new container IP after the backend restarts.
    resolver 127.0.0.11 valid=10s ipv6=off;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml application/wasm;

    # Container healthcheck target — must stay above the SPA fallback.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # ---- REST API -> backend ----
    location /api/ {
        set $backend_api http://backend:5000;
        # $request_uri keeps the /api prefix and query string intact
        proxy_pass $backend_api$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # backend caps uploads at 10MB; leave headroom for multipart overhead
        client_max_body_size 15m;
        proxy_request_buffering off;
        proxy_read_timeout 300s;
    }

    # ---- Socket.io -> backend (websocket upgrade) ----
    location /socket.io/ {
        set $backend_ws http://backend:5000;
        proxy_pass $backend_ws$request_uri;
        proxy_http_version 1.1;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        $connection_upgrade;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # long-lived connections: don't let nginx cut idle sockets
        proxy_read_timeout 7d;
        proxy_send_timeout 7d;
        proxy_buffering off;
    }

    # ---- static assets ----
    # Vite fingerprints these filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The entry point must never be cached, or clients pin an old bundle.
    location = /index.html {
        add_header Cache-Control "no-store";
    }

    # ---- SPA fallback ----
    location / {
        try_files $uri $uri/ /index.html;
    }
}
